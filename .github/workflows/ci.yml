name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build program
        run: |
          gcc main.c booking.c flights.c payment.c user.c -o program || exit 1

      - name: Run tests
        run: |
          set -e
          gcc TESTS/test_print_lines.c -o test_print_lines
          echo "--- TEST: test_print_lines ---"
          ./test_print_lines
          echo "--- End of tests ---"
